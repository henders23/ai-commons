<!DOCTYPE html>
<html lang="en" data-corners="soft" data-density="comfortable">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search · EAP AI Commons</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="commons.css" />
<style>
.searchpage{ padding-top:30px; }
.bigfield{ display:flex; align-items:center; gap:14px; height:60px; padding:0 20px; margin-top:22px;
  background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r-card); transition:border-color .15s, background .15s; }
.bigfield:focus-within{ border-color:var(--border-3); background:var(--surface-2); }
.bigfield svg{ width:20px; height:20px; flex:none; color:var(--dim); }
.bigfield input{ flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font-family:var(--font); font-size:19px; letter-spacing:-0.01em; }
.bigfield input::placeholder{ color:var(--dim); }
.bigfield .clr{ font-family:var(--mono); font-size:12px; color:var(--dim); border:1px solid var(--border-2); border-radius:6px; padding:3px 9px; cursor:pointer; background:none; }
.bigfield .clr:hover{ color:var(--text); }

.s-meta{ font-family:var(--mono); font-size:12.5px; color:var(--muted); margin:22px 0 24px; }
.s-meta b{ color:var(--text); font-weight:500; }

.artgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--grid-gap); }

mark{ background:color-mix(in srgb,var(--accent) 26%, transparent); color:var(--text); border-radius:3px; padding:0 2px; }

.s-empty{ border:1px solid var(--border); border-radius:var(--r-card); background:var(--surface); padding:48px 40px; text-align:center; }
.s-empty .ic{ width:48px; height:48px; margin:0 auto 16px; display:grid; place-items:center; border:1px solid var(--border-2); border-radius:13px; color:var(--dim); }
.s-empty h2{ font-size:22px; }
.s-empty p{ color:var(--muted); margin:10px 0 0; }
.s-empty .chips{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:24px; }
.s-chip{ font-family:var(--mono); font-size:12.5px; color:var(--muted); border:1px solid var(--border-2); border-radius:20px; padding:6px 14px; cursor:pointer; transition:.13s; }
.s-chip:hover{ color:var(--text); border-color:var(--border-3); background:var(--surface-2); }

.suggest{ margin-top:30px; }
.suggest .lbl{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin-bottom:16px; }

@media (max-width:880px){ .search{ display:none; } }
@media (max-width:760px){ .artgrid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:560px){ .artgrid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
  <header class="nav">
    <div class="nav-in">
      <a class="brand" href="EAP AI Commons.html"><span class="dot"></span>EAP&nbsp;AI&nbsp;Commons</a>
      <div class="nav-spacer"></div>
      <label class="search" for="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Search the library" autocomplete="off" />
        <span class="kbd">⌘K</span>
      </label>
      <button class="btn btn-primary" data-open-upload>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Upload
      </button>
    </div>
  </header>

  <main class="wrap searchpage">
    <nav class="crumbs"><a href="EAP AI Commons.html">Home</a><span class="sep">/</span><b>Search</b></nav>
    <div class="bigfield">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="bigsearch" type="text" placeholder="Search skills, prompts, policies, frameworks…" autocomplete="off" />
      <button class="clr" id="clearbtn">esc</button>
    </div>
    <div class="s-meta" id="smeta"></div>
    <div id="sresults"></div>
  </main>

  <footer class="footer">
    <div class="footer-in">
      <a class="brand" href="EAP AI Commons.html"><span class="dot"></span>EAP&nbsp;AI&nbsp;Commons</a>
      <div class="links">
        <a href="#">About</a><a href="#">Guidelines</a><a data-open-upload href="#">Contribute</a><a href="#">RSS</a>
      </div>
      <div class="legal">Open access · CC BY 4.0</div>
    </div>
  </footer>

  <div id="tweaks-root"></div>

  <script src="commons-data.js"></script>
  <script src="commons.js"></script>
  <script>
  (function () {
    const big = document.getElementById('bigsearch');
    const meta = document.getElementById('smeta');
    const box = document.getElementById('sresults');
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

    function highlight(text, terms) {
      let out = esc(text);
      terms.forEach(t => {
        if (!t) return;
        const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
        out = out.replace(re, '<mark>$1</mark>');
      });
      return out;
    }

    // a result card with highlighted title/description
    function resultCard(a, terms) {
      return `<a class="art" href="Artefact.html#id=${a.id}">
        <div class="art-top"><span class="type">${a.type === 'link' ? 'LINK' : 'DOC'}</span><span class="art-cat">${catById(a.cat).name}</span></div>
        <h3>${highlight(a.title, terms)}</h3>
        <p class="art-desc">${highlight(a.desc, terms)}</p>
        <div class="art-foot"><span class="lvl">${a.level}</span><span>${a.added}</span></div>
      </a>`;
    }

    const POPULAR = ['prompting', 'integrity', 'feedback', 'disclosure', 'critical reading', 'rubric'];

    function run(q) {
      q = q.trim();
      history.replaceState(null, '', q ? 'Search.html#q=' + encodeURIComponent(q) : 'Search.html');
      document.title = (q ? `“${q}” · ` : '') + 'Search · EAP AI Commons';

      if (!q) {
        meta.textContent = '';
        box.innerHTML = `<div class="suggest">
          <div class="lbl">Popular searches</div>
          <div class="s-empty" style="text-align:left;padding:30px 32px;">
            <div class="chips" style="justify-content:flex-start;">${POPULAR.map(p => `<span class="s-chip" data-q="${p}">${p}</span>`).join('')}</div>
          </div></div>`;
        bindChips();
        return;
      }

      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      const results = searchArtefacts(q);
      meta.innerHTML = `<b>${results.length}</b> result${results.length === 1 ? '' : 's'} for “<b>${esc(q)}</b>”`;

      if (!results.length) {
        box.innerHTML = `<div class="s-empty">
          <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
          <h2>No artefacts match “${esc(q)}”.</h2>
          <p>Try a broader term, or browse a category instead.</p>
          <div class="chips">${POPULAR.map(p => `<span class="s-chip" data-q="${p}">${p}</span>`).join('')}</div>
        </div>`;
        bindChips();
        return;
      }
      box.innerHTML = `<div class="artgrid">${results.map(a => resultCard(a, terms)).join('')}</div>`;
    }

    function bindChips() {
      box.querySelectorAll('.s-chip').forEach(ch => ch.addEventListener('click', () => { big.value = ch.dataset.q; run(ch.dataset.q); big.focus(); }));
    }

    let timer;
    big.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => run(big.value), 120); });
    big.addEventListener('keydown', e => { if (e.key === 'Escape') { big.value = ''; run(''); } });
    document.getElementById('clearbtn').addEventListener('click', () => { big.value = ''; run(''); big.focus(); });

    const q0 = param('q') || '';
    big.value = q0;
    run(q0);
    big.focus();

    // nav-search (or back/forward) while already on this page updates the hash → re-run
    window.addEventListener('hashchange', () => {
      const q = param('q') || '';
      if (q !== big.value.trim()) { big.value = q; run(q); }
    });
  })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="tweaks-home.jsx"></script>
</body>
</html>
