<!DOCTYPE html>
<html lang="en" data-corners="soft" data-density="comfortable">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{var t=localStorage.getItem('aice-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){}})();</script>
<title>Artefact · AI Commons for Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="commons.css" />
<style>
.detail-head{ padding:24px 0 0; }
.dh-top{ display:flex; align-items:center; gap:10px; }
.detail-head h1{ font-size:clamp(28px,3.8vw,42px); margin-top:18px; max-width:20ch; }
.detail-head .intro{ margin-top:16px; color:var(--muted); font-size:18px; line-height:1.5; max-width:60ch; }
.ratingline{ display:inline-flex; align-items:center; gap:10px; margin-top:16px; }
.ratingline .rl-avg{ font-size:15px; font-weight:600; }
.ratingline .rl-n{ font-family:var(--mono); font-size:12px; color:var(--dim); }
.ratingline:hover .rl-n{ color:var(--muted); }

.detail-grid{ display:grid; grid-template-columns:1.55fr 1fr; gap:36px; align-items:start; margin-top:36px; }

.preview{ position:relative; border:1px solid var(--border); border-radius:var(--r-card); min-height:380px; display:grid; place-items:center;
  background:repeating-linear-gradient(45deg, var(--surface) 0 11px, var(--surface-2) 11px 22px); }
.preview .plabel{ font-family:var(--mono); font-size:12px; color:var(--dim); background:var(--bg); border:1px solid var(--border); padding:6px 13px; border-radius:7px; }
.pager{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; color:var(--dim); font-family:var(--mono); font-size:12px; }
.pager .d{ width:7px; height:7px; border-radius:50%; border:1px solid var(--border-3); }
.pager .d.on{ background:var(--accent); border-color:var(--accent); }

.linkcard{ border:1px solid var(--border); border-radius:var(--r-card); background:var(--surface); padding:26px; display:flex; align-items:center; gap:18px; }
.linkcard .lk-ic{ width:46px; height:46px; flex:none; display:grid; place-items:center; border:1px solid var(--border-2); border-radius:11px; color:var(--muted); }
.linkcard .lk-host{ font-family:var(--mono); font-size:13px; color:var(--muted); }
.linkcard h3{ font-size:18px; margin-top:3px; }

.callout{ margin-top:22px; border:1px solid var(--border); border-radius:var(--r-card); background:
  radial-gradient(120% 200% at 0% 0%, color-mix(in srgb,var(--accent) 7%, transparent), transparent 55%), var(--surface); padding:22px 24px; }
.callout .ml{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
.callout p{ margin:9px 0 0; font-size:15.5px; line-height:1.6; color:var(--text); }

.aside-actions{ display:flex; flex-direction:column; gap:10px; }
.aside-actions .btn{ width:100%; }
.meta{ margin-top:18px; border:1px solid var(--border); border-radius:var(--r-card); background:var(--surface); padding:4px 20px; }
.meta-row{ padding:15px 0; border-bottom:1px solid var(--border); }
.meta-row:last-child{ border-bottom:0; }
.meta .ml{ font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); }
.meta .mv{ margin-top:7px; font-size:15px; }
.meta .mv a:hover{ color:var(--text); text-decoration:underline; }

.related .section-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; }
.related h2{ font-size:24px; }
.related .artgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--grid-gap); }

@media (max-width:920px){ .detail-grid{ grid-template-columns:1fr; gap:26px; } .related .artgrid{ grid-template-columns:1fr; } }
@media (max-width:880px){ .search{ display:none; } }
</style>
</head>
<body>
  <header class="nav">
    <div class="nav-in">
      <a class="brand" href="EAP AI Commons.html"><span class="dot"></span>AI&nbsp;Commons&nbsp;for&nbsp;Education</a>
      <div class="nav-spacer"></div>
      <label class="search" for="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Search the library" autocomplete="off" />
        <span class="kbd">⌘K</span>
      </label>
      <button class="btn btn-primary" data-open-upload>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Upload
      </button>
    </div>
  </header>

  <main class="wrap" style="padding-top:30px;" id="app"></main>

  <footer class="footer">
    <div class="footer-in">
      <a class="brand" href="EAP AI Commons.html"><span class="dot"></span>AI&nbsp;Commons&nbsp;for&nbsp;Education</a>
      <div class="links">
        <a href="#">About</a><a href="#">Guidelines</a><a data-open-upload href="#">Contribute</a><a href="#">RSS</a>
      </div>
      <div class="legal">Open access · CC BY 4.0</div>
    </div>
  </footer>

  <div id="tweaks-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="commons-data.js"></script>
  <script src="commons.js"></script>
  <script src="social.js"></script>
  <script>
  (async function () {
    await loadData();
    const a = artById(param('id')) || ARTEFACTS[0];
    if (!a) { document.getElementById('app').innerHTML = '<p class="intro" style="padding-top:40px;">This artefact could not be found.</p>'; return; }
    const c = catById(a.cat);
    const isLink = a.type === 'link';
    const fileHref = a.file_path ? fileUrl(a.file_path) : null;
    const related = ARTEFACTS.filter(x => x.cat === a.cat && x.id !== a.id).slice(0, 3);
    document.title = a.title + ' · EAP AI Commons';
    const ag = await SOCIAL.aggregate(a.id);
    const ratingLine = ag.n
      ? `<a class="ratingline" data-scroll style="cursor:pointer">${SOCIAL.starsSvg(ag.avg, { size: 15 })}<span class="rl-avg">${ag.avg.toFixed(1)}</span><span class="rl-n">${ag.n} rating${ag.n === 1 ? '' : 's'}</span></a>`
      : `<a class="ratingline" data-scroll style="cursor:pointer">${SOCIAL.starsSvg(0, { size: 15 })}<span class="rl-n">Be the first to rate</span></a>`;

    const previewBlock = isLink
      ? `<div class="linkcard">
           <div class="lk-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></div>
           <div><div class="lk-host">external resource</div><h3>Opens on an external site</h3></div>
         </div>`
      : `<div class="preview"><span class="plabel">document preview — page 1 of 3</span></div>
         <div class="pager"><span>◂</span><span class="d on"></span><span class="d"></span><span class="d"></span><span>▸</span></div>`;

    const primaryAction = isLink
      ? `<a class="btn btn-primary" href="${a.link_url || '#'}" ${a.link_url ? 'target="_blank" rel="noopener"' : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg>Open source link</a>`
      : `<a class="btn btn-primary" ${fileHref ? `href="${fileHref}" target="_blank" rel="noopener"` : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>Download (${a.format})</a>`;

    document.getElementById('app').innerHTML = `
      <nav class="crumbs">
        <a href="EAP AI Commons.html">Home</a><span class="sep">/</span>
        <a href="Browse.html#cat=${a.cat}">${c.name}</a><span class="sep">/</span>
        <b>${a.title}</b>
      </nav>

      <div class="detail-head">
        <div class="dh-top"><span class="type">${a.type === 'link' ? 'LINK' : 'DOC'}</span><span class="art-cat" style="margin:0;color:var(--dim);font-family:var(--mono);font-size:12px;">${c.name}</span></div>
        <h1>${a.title}</h1>
        <p class="intro">${a.desc}</p>
        ${ratingLine}
      </div>

      <div class="detail-grid">
        <div>
          ${previewBlock}
          <div class="callout">
            <div class="ml">How to use it</div>
            <p>${a.howto}</p>
          </div>
        </div>
        <aside>
          <div class="aside-actions">
            ${primaryAction}
            <a class="btn" data-open-upload>Suggest an edit</a>
          </div>
          <div class="meta">
            <div class="meta-row"><div class="ml">Who it's for</div><div class="mv">${a.level}</div></div>
            <div class="meta-row"><div class="ml">Category</div><div class="mv"><a href="Browse.html#cat=${a.cat}">${c.name}</a></div></div>
            <div class="meta-row"><div class="ml">Tags</div><div class="mv tagrow">${a.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div></div>
            <div class="meta-row"><div class="ml">Contributor</div><div class="mv">${a.author}</div></div>
            <div class="meta-row"><div class="ml">Format</div><div class="mv">${a.format}</div></div>
            <div class="meta-row"><div class="ml">Added</div><div class="mv">${a.added} ago</div></div>
          </div>
        </aside>
      </div>

      ${related.length ? `<section class="related block" style="padding-top:var(--sec);">
        <div class="section-head"><h2>More in ${c.name}</h2><a class="btn btn-sm" href="Browse.html#cat=${a.cat}">View all</a></div>
        <div class="artgrid">${related.map(artCard).join('')}</div>
      </section>` : ''}

      <section class="social" id="social"></section>
    `;

    SOCIAL.render(a.id, document.getElementById('social'));

    // jump to ratings without touching the URL hash (which carries the artefact id)
    document.querySelector('[data-scroll]')?.addEventListener('click', () => {
      const el = document.getElementById('social');
      window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' });
    });
  })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="tweaks-home.jsx"></script>
</body>
</html>
